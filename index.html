<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>EuroQuest 🗺️ — European Geography Challenge</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#d4a017;--gold2:#f0c040;
  --grass3:#3a7820;--grass:#5aac3a;--grass2:#80c860;
  --done:#5aac5a;
  --parch:#f5e6c3;--paper:#fffdf5;
  --brn:#3a1f05;--brnm:#7a4e2a;--brnl:#a87050;
  --ok:#27ae60;--err:#e74c3c;
  --W:430px
}
html,body{height:100%;overflow:hidden;font-family:'Nunito',sans-serif;background:#1a0a02;color:var(--brn)}

/* ── HEADER ── */
#hdr{
  background:linear-gradient(90deg,#100600,#361604 50%,#100600);
  border-bottom:2.5px solid var(--gold);padding:5px 18px;
  display:flex;align-items:center;gap:12px;height:50px;
  box-shadow:0 3px 14px rgba(0,0,0,.55);position:relative;z-index:10;
}
#hdr h1{font-family:'Playfair Display',serif;color:var(--gold2);font-size:1.6rem;font-weight:900;letter-spacing:2px;line-height:1}
.hsub{font-size:.63rem;color:var(--brnl);letter-spacing:1.5px;text-transform:uppercase}
.hsp{flex:1}
.hstat{text-align:center}
.hval{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:900;color:var(--gold2);line-height:1}
.hlbl{font-size:.56rem;color:var(--brnl);text-transform:uppercase;letter-spacing:1.5px}
.hdiv{width:1px;height:34px;background:rgba(212,160,23,.4)}

/* ── LAYOUT ── */
#layout{display:flex;height:calc(100vh - 50px);overflow:hidden;width:100%}

/* ── MAP ── */
#mwrap{flex:1;position:relative;overflow:hidden;background:radial-gradient(ellipse at 36% 54%,#5b9db5 0%,#3c7993 65%,#2a5c75 100%)}
#msvg{width:100%;height:100%}

.cp{stroke:rgba(255,255,255,.55);stroke-width:.55;stroke-linejoin:round;cursor:pointer;transition:filter .15s,stroke .15s,stroke-width .15s}
.cp:hover{stroke:#fff;stroke-width:1.8;filter:brightness(1.12) drop-shadow(0 0 5px rgba(255,255,255,.45))}
.cp.done{fill:var(--done)!important;stroke:#2a7020;cursor:default}
.cp.done:hover{filter:brightness(1.05);stroke-width:.55}
.cp.lit{stroke:var(--gold);stroke-width:2.5;filter:brightness(1.08)}

#leg{
  position:absolute;bottom:14px;left:14px;
  background:rgba(245,230,195,.94);border:1px solid var(--brnm);
  border-radius:8px;padding:7px 11px;font-size:.68rem;color:var(--brn);
  box-shadow:0 2px 8px rgba(0,0,0,.2)
}
.legr{display:flex;align-items:center;gap:7px;padding:2px 0;font-weight:700}
.legsw{width:13px;height:13px;border-radius:3px;border:1px solid rgba(0,0,0,.15)}

#tip{
  position:fixed;background:rgba(5,2,0,.9);color:#f5e6c3;padding:5px 11px;
  border-radius:6px;font-size:.76rem;font-weight:700;letter-spacing:.3px;
  pointer-events:none;display:none;z-index:60;border:1px solid var(--gold)
}

/* ── SIDEBAR ── */
#sb{
  width:var(--W);flex-shrink:0;
  background:linear-gradient(175deg,#142506 0%,#0c1904 100%);
  border-left:2px solid var(--grass3);display:flex;flex-direction:column;overflow:hidden
}

/* Score */
#scard{padding:10px 12px 9px;background:rgba(0,0,0,.4);border-bottom:1px solid var(--grass3);flex-shrink:0}
.srow{display:flex;align-items:stretch}
.sbox{flex:1;text-align:center;padding:0 3px}
.snum{font-family:'Playfair Display',serif;font-size:2rem;font-weight:900;color:var(--gold2);line-height:1}
.slbl{font-size:.68rem;color:var(--grass2);text-transform:uppercase;letter-spacing:1.3px;margin-top:3px}
.ssep{width:1px;background:var(--grass3);margin:0 5px;flex-shrink:0}
#mstone{margin-top:8px;font-size:.76rem;color:var(--grass2);text-align:center;min-height:16px;letter-spacing:.3px;line-height:1.3}
.pbg{margin-top:6px;background:rgba(0,0,0,.45);border:1px solid var(--grass3);border-radius:30px;height:10px;overflow:hidden}
#pfill{height:100%;width:0%;background:linear-gradient(90deg,var(--grass3),var(--grass2));border-radius:30px;transition:width .75s cubic-bezier(.34,1.56,.64,1)}

/* Zuzu video corner */
#cwrap{flex:1;padding:8px 12px 6px;display:flex;flex-direction:column;overflow:hidden;min-height:0;gap:6px}
#ctit{text-align:center;font-family:'Playfair Display',serif;color:var(--grass2);font-size:.9rem;letter-spacing:.8px;flex-shrink:0}
#zvwrap{flex:1;position:relative;border-radius:14px;overflow:hidden;background:#0a0a0a;min-height:0;display:flex;flex-direction:column}
#zidle{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;position:relative}
#zidleface{width:100%;height:100%;object-fit:cover;object-position:center 10%;filter:brightness(.55) saturate(.7);transition:filter .6s}
#zidle.alive #zidleface{filter:brightness(.85) saturate(1)}
#zidlemsg{position:absolute;bottom:0;left:0;right:0;padding:9px 12px 11px;background:linear-gradient(transparent,rgba(0,0,0,.85));color:rgba(255,255,255,.85);font-size:.74rem;font-weight:700;text-align:center;line-height:1.4}
#zvactive{display:none;position:absolute;inset:0;width:100%;height:100%}
#zvactive.playing{display:block}
#zvside{width:100%;height:100%;object-fit:cover;object-position:center 10%}
#zvcap{position:absolute;bottom:0;left:0;right:0;padding:9px 12px 11px;background:linear-gradient(transparent,rgba(0,0,0,.88));font-family:'Nunito',sans-serif;font-weight:900;font-size:.82rem;color:white;text-align:center;line-height:1.6;min-height:42px}
#znxtlbl{font-size:.68rem;color:var(--grass2);text-align:center;letter-spacing:.3px;flex-shrink:0}


/* Cartoon Zuzu styling */
.zuzu-container{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 40%, #2a5036 0%, #1a3a26 70%, #0c1f15 100%);
  position:relative;overflow:hidden;
}
.zuzu-svg{
  width:90%;height:90%;max-width:340px;
  animation:zuzuBob 3.4s ease-in-out infinite;
  transition:transform .4s ease;
}
@keyframes zuzuBob{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-4px) scale(1.012)}
}
/* Blinking */
.zw{transform-origin:center;transform-box:fill-box;animation:zuzuBlink 5.7s ease-in-out infinite}
.zw-r{animation-delay:.05s}
@keyframes zuzuBlink{
  0%,94%,100%{transform:scaleY(1)}
  96%,98%{transform:scaleY(.08)}
}
/* Talking mouth animation */
.zuzu-container.talking .zm-happy{animation:mouthTalk .26s ease-in-out infinite alternate}
.zuzu-container.talking .zm-tongue{animation:mouthTalk .26s ease-in-out infinite alternate}
@keyframes mouthTalk{
  0%{transform:scaleY(.45);transform-origin:center top}
  100%{transform:scaleY(1);transform-origin:center top}
}
/* Expression states — control which mouth & eye shapes show */
.zuzu-container.happy .zm-idle{opacity:0}
.zuzu-container.happy .zm-happy{opacity:1}
.zuzu-container.happy .zm-tongue{opacity:1}
.zuzu-container.happy .zuzu-blush{opacity:.55}
.zuzu-container.happy .zs{r:4.5}

.zuzu-container.mid .zm-idle{opacity:0}
.zuzu-container.mid .zm-smirk{opacity:1}

.zuzu-container.shook .zm-idle{opacity:0}
.zuzu-container.shook .zm-shook{opacity:1}
.zuzu-container.shook .zw{transform:scaleY(1.15) scaleX(1.08)}
.zuzu-container.shook .zb{opacity:1}

.zuzu-container.angry .zm-idle{opacity:0}
.zuzu-container.angry .zm-smirk{opacity:1}
.zuzu-container.angry .zb{opacity:1}
.zuzu-container.angry .zp{transform:translateY(3px)}

.zuzu-container.sass .zm-idle{opacity:0}
.zuzu-container.sass .zm-smirk{opacity:1}
.zuzu-container.sass .zb{opacity:1}
.zuzu-container.sass .zp{transform:translate(2px, 2px)}

.zuzu-container.talking .zm-idle{opacity:0}
.zuzu-container.talking .zm-happy{opacity:1}
.zuzu-container.talking .zm-tongue{opacity:1}

.zuzu-container.sleeping .zw{transform:scaleY(.1)}
.zuzu-container.sleeping{filter:saturate(.6) brightness(.7)}
.zuzu-container.sleeping .zuzu-svg{animation:zuzuBob 4.5s ease-in-out infinite}

/* Idle caption overlay */
.zuzu-cap{
  position:absolute;left:0;right:0;bottom:0;
  padding:10px 14px;
  background:linear-gradient(transparent,rgba(0,0,0,.88));
  font-weight:800;font-size:.78rem;text-align:center;
  color:#fff;line-height:1.5;letter-spacing:.2px;
  font-family:'Nunito',sans-serif;
  min-height:42px;
}




/* Country description text (karaoke-highlighted with video) */
#study-text-pop{flex:1 1 0;min-width:240px;max-width:520px;padding:18px 22px;background:rgba(255,255,255,.04);border-radius:10px;font-size:.95rem;line-height:1.6;color:rgba(255,250,235,.5);text-align:left;font-family:'Nunito',sans-serif;transition:color .2s ease;align-self:stretch}
#study-text-pop .kw{transition:color .25s ease, text-shadow .25s ease;display:inline}
#study-text-pop .kw.lit{color:#fff8d0;text-shadow:0 0 8px rgba(255,212,74,.4)}
/* Standalone joke (when no video) */



/* Study popup */
#study-ov{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
#study-ov.open{display:flex}
#study-mdl{background:linear-gradient(180deg,#1a3a26 0%,#0c1f15 100%);border-radius:16px;padding:18px 22px 16px;width:auto;min-width:320px;max-width:min(96vw, 980px);max-height:94vh;box-shadow:0 30px 80px rgba(0,0,0,.65),0 0 0 2px var(--gold);position:relative;animation:mIn .28s cubic-bezier(.34,1.56,.64,1) both;text-align:center;display:flex;flex-direction:column}
#study-close{position:absolute;top:10px;right:12px;background:transparent;border:none;color:#e8d4a0;font-size:1.8rem;line-height:1;cursor:pointer;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .15s}
#study-close:hover{background:rgba(255,255,255,.12)}
#study-flag-pop{font-size:2.6rem;line-height:1;margin-bottom:2px}
#study-name-pop{font-family:'Playfair Display',serif;font-size:1.55rem;color:var(--gold);font-weight:800;margin-bottom:1px;letter-spacing:.3px;line-height:1.1}
#study-capital-pop{font-size:.85rem;color:#e8d4a0;font-weight:600;margin-bottom:10px}
#study-video-wrap-pop{flex:0 0 400px;max-width:48%;border-radius:12px;overflow:hidden;background:#000;display:flex;justify-content:center;align-items:center;align-self:stretch}
#study-video-pop{display:block;width:100%;height:auto;max-height:min(60vh,460px);object-fit:contain}

#study-header-pop{flex:0 0 auto}
#study-body-pop{display:flex;gap:14px;align-items:stretch;justify-content:center;flex:1 1 auto;min-height:0;max-width:100%}
@media (max-width:760px){#study-body-pop{flex-wrap:wrap}#study-video-wrap-pop{flex:0 0 auto;max-width:100%}}
#study-body-pop.no-video{justify-content:center}
#study-body-pop.no-video #study-text-pop{flex:0 1 640px;max-width:720px;font-size:1rem;line-height:1.7;padding:22px 28px;align-self:auto}
#study-body-pop.no-video #study-text-pop.joke-mode{font-style:italic;text-align:center;background:linear-gradient(135deg,rgba(212,160,23,.12),rgba(212,160,23,.04));border:1px solid rgba(212,160,23,.35);justify-content:center}
#study-text-pop strong{color:var(--gold);font-weight:800;font-size:1.04em;letter-spacing:.4px}
#study-text-pop .kw{transition:color .25s ease, text-shadow .25s ease}
#study-text-pop .kw.lit{color:#fff8d0;text-shadow:0 0 8px rgba(255,212,74,.4)}
#study-text-pop strong .kw.lit{color:#ffd44a;text-shadow:0 0 10px rgba(255,212,74,.6)}

/* Quiz restart pill (floating in corner during quiz mode) */
#quiz-restart-pill{position:fixed;top:62px;left:14px;background:rgba(0,0,0,.6);color:var(--gold);border:1.5px solid var(--gold);font-family:'Nunito',sans-serif;font-weight:800;font-size:.72rem;padding:6px 12px;border-radius:20px;cursor:pointer;display:none;z-index:50;letter-spacing:.3px;backdrop-filter:blur(6px)}
#quiz-restart-pill.show{display:block}
#quiz-restart-pill:hover{background:var(--gold);color:#3a2010}

/* Mode switcher in header */
.modesw{display:flex;gap:6px;background:rgba(0,0,0,.35);padding:5px;border-radius:12px;border:1px solid var(--grass3)}
.modebtn{background:transparent;border:none;color:#e8d4a0;font-family:'Nunito',sans-serif;font-weight:800;font-size:.9rem;padding:9px 18px;border-radius:8px;cursor:pointer;letter-spacing:.3px;transition:all .2s ease;display:flex;align-items:center;gap:6px}
.modebtn:hover{background:rgba(255,255,255,.08)}
.modebtn.active{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#3a2010;box-shadow:0 2px 8px rgba(212,160,23,.4)}
/* Mode panels */
.mode-panel{display:none;flex-direction:column;height:100%;overflow:hidden}
.mode-panel.active{display:flex}
.sp-header{display:flex;gap:10px;align-items:center;padding:14px 16px 10px;border-bottom:1px solid var(--grass3);flex-shrink:0}
.sp-title{font-family:'Playfair Display',serif;font-size:1.15rem;color:var(--gold);font-weight:800}
.sp-sub{font-size:.72rem;color:var(--grass2);opacity:.85}
/* Study panel */
#study-content{flex:1;padding:14px 16px;overflow-y:auto;min-height:0}
#study-capital{font-size:.95rem;color:#e8d4a0;text-align:center;margin-bottom:14px;font-weight:600}
#study-empty{text-align:center;padding:40px 20px;color:#e8d4a0}
#study-video-fallback{padding:30px 20px;text-align:center;color:#e8d4a0}
#study-flag{font-size:3.4rem;text-align:center;margin-bottom:6px;line-height:1}
#study-name{font-family:'Playfair Display',serif;font-size:1.6rem;color:var(--gold);text-align:center;font-weight:700;margin-bottom:2px}
#study-video-wrap{border-radius:12px;overflow:hidden;background:#0a0a0a;margin-bottom:14px;position:relative;min-height:200px;display:flex;align-items:center;justify-content:center}
#study-video{width:100%;display:block;max-height:340px;background:#000}
#study-video-fallback{padding:30px 20px;text-align:center;color:#e8d4a0}
#study-explored-tags-wrap h4{font-family:'Playfair Display',serif;color:var(--gold);font-size:.95rem;margin:0 0 8px 0;font-weight:700;letter-spacing:.3px}
#study-tags{display:flex;flex-wrap:wrap;gap:5px}
.empty-hint{font-size:.65rem;color:var(--grass2);font-style:italic;opacity:.75}
/* Quiz panel */
#quiz-scard{padding:12px 16px 8px;border-bottom:1px solid var(--grass3);flex-shrink:0}
#quiz-restart-btn{margin:10px 16px 14px;padding:9px 14px;background:transparent;border:1.5px solid var(--gold);color:var(--gold);font-family:'Nunito',sans-serif;font-weight:800;font-size:.78rem;border-radius:8px;cursor:pointer;flex-shrink:0;transition:all .15s ease}
#quiz-restart-btn:hover{background:var(--gold);color:#3a2010}
/* Stats */
#strow{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--grass3);flex-shrink:0}
.stc{padding:6px 2px;text-align:center;border-right:1px solid rgba(58,120,32,.35)}
.stc:last-child{border-right:none}
.stn{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:900;color:var(--gold2)}
.stl{font-size:.6rem;color:var(--grass2);text-transform:uppercase;letter-spacing:.8px}

/* Done list */
#dsec{border-top:1px solid var(--grass3);padding:6px 12px 8px;flex-shrink:0;max-height:100px;overflow-y:auto}
#dsec h4{font-size:.64rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--grass2);margin-bottom:4px}
#dtags{display:flex;flex-wrap:wrap;gap:4px}
.dtag{background:rgba(58,120,32,.28);border:1px solid var(--grass3);border-radius:4px;padding:2px 7px;font-size:.67rem;color:#a5d6a7}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--grass3);border-radius:2px}



/* ── MODAL ── */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:100}
#ov.open{display:flex}
#mdl{background:var(--paper);border-radius:16px;padding:20px 22px;width:420px;max-width:93vw;max-height:88vh;overflow-y:auto;overflow-x:hidden;box-shadow:0 30px 80px rgba(0,0,0,.65),0 0 0 3px var(--gold);animation:mIn .3s cubic-bezier(.34,1.56,.64,1) both}
@keyframes mIn{from{transform:scale(.82) translateY(24px);opacity:0}to{transform:scale(1);opacity:1}}

#mflag{text-align:center;font-size:3rem;margin-bottom:2px;line-height:1}
#mprompt{font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;font-style:italic;color:var(--brn);text-align:center;margin-bottom:16px}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:var(--brnm);margin-bottom:4px}
.fg input{width:100%;padding:9px 12px;border:2px solid #e0d8cc;border-radius:9px;font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:600;color:var(--brn);background:white;outline:none;transition:border-color .2s,box-shadow .2s}
.fg input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,160,23,.18)}
.fg input.ok{border-color:var(--ok);background:#f0fff5}
.fg input.no{border-color:var(--err);background:#fff4f4}

#sbtn{width:100%;padding:11px;background:linear-gradient(135deg,#d4a017,#e06c1a);color:white;font-family:'Playfair Display',serif;font-size:1.02rem;font-weight:700;border:none;border-radius:9px;cursor:pointer;letter-spacing:1px;transition:all .18s;box-shadow:0 4px 16px rgba(212,160,23,.3)}
#sbtn:hover{transform:translateY(-2px);box-shadow:0 7px 22px rgba(212,160,23,.45)}
#sbtn:active{transform:none}

#rp{display:none;margin-top:13px;background:#faf5ea;border:1px solid #e8dcc8;border-radius:10px;padding:12px}
#rp.show{display:block}
/* Zuzu reaction card */
#zreact{display:none;margin-bottom:10px;border-radius:12px;overflow:hidden;position:relative;background:#111;height:300px}
#zmodal{height:100%;width:100%}
#zreact.show{display:block}
#zvid,#zimg{width:100%;height:100%;object-fit:cover;object-position:center 15%}
#zcap{
  position:absolute;bottom:0;left:0;right:0;
  padding:10px 14px 12px;
  background:linear-gradient(transparent,rgba(0,0,0,.82));
  font-family:'Nunito',sans-serif;font-weight:900;font-size:.88rem;
  color:white;text-align:center;line-height:1.4;min-height:44px
}
.zcap-badge{
  display:inline-block;background:#00c853;color:white;
  padding:2px 10px;border-radius:20px;margin:2px 3px;
  font-size:.82rem;font-weight:900;letter-spacing:.3px
}
.zcap-badge.bad{background:#d32f2f}
#zcap-loading{font-style:italic;opacity:.7;font-size:.78rem}
@keyframes wordPop{from{opacity:0;transform:scale(.7) translateY(4px)}to{opacity:1;transform:scale(1) translateY(0)}}
.zcap-badge{animation:wordPop .18s ease both}
@keyframes dotdot{0%{content:'.'}33%{content:'..'}66%{content:'...'}}
.rrow{display:flex;align-items:center;padding:5px 0;font-size:.87rem;border-bottom:1px solid #ede5d4}
.rrow:last-of-type{border-bottom:none}
.rric{font-size:.95rem;margin-right:6px}
.rrlb{font-weight:700}.rrlb.ok{color:var(--ok)}.rrlb.no{color:var(--err)}
.rrans{font-size:.77rem;color:var(--brnl);margin-left:auto;font-style:italic}
.pshow{text-align:center;padding:9px 0 3px;margin-top:5px;border-top:2px dashed var(--gold)}
#pnum{font-family:'Playfair Display',serif;font-size:2rem;font-weight:900;line-height:1}
#pmsg{font-size:.76rem;color:var(--brnm);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-top:3px}
#cbtn{width:100%;padding:9px;margin-top:9px;background:var(--brn);color:var(--parch);font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:800;border:none;border-radius:8px;cursor:pointer;transition:background .15s}
#cbtn:hover{background:var(--brnm)}

/* Zoom buttons */
#zbts{position:absolute;top:14px;right:14px;display:flex;flex-direction:column;gap:5px;z-index:20}
.zb{width:34px;height:34px;background:rgba(245,230,195,.93);border:1px solid var(--brnm);border-radius:7px;cursor:pointer;font-size:1.15rem;font-weight:900;color:var(--brn);display:flex;align-items:center;justify-content:center;line-height:1;transition:background .15s;user-select:none;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.zb:hover{background:var(--parch);border-color:var(--brn)}
.zb.reset{font-size:.75rem;letter-spacing:.5px}

<script>
'use strict';

/* ════════════════════════════════════════

const CTR = {

 578: {n:'Norway',                k:'Oslo',            a:'NO', al:['norge','noreg']},
 616: {n:'Poland',                k:'Warsaw',          a:'PL', al:['polska','warszawa']},
 620: {n:'Portugal',              k:'Lisbon',          a:'PT', al:['lisboa']},
 642: {n:'Romania',               k:'Bucharest',       a:'RO', al:['bucuresti']},
 643: {n:'Russia',                k:'Moscow',          a:'RU', al:['russian federation','rossiya','moskva']},
 688: {n:'Serbia',                k:'Belgrade',        a:'RS', al:['srbija','beograd']},
 703: {n:'Slovakia',              k:'Bratislava',      a:'SK', al:['slovak republic','slovensko']},
 705: {n:'Slovenia',              k:'Ljubljana',       a:'SI', al:['slovenija']},

 756: {n:'Switzerland',           k:'Bern',            a:'CH', al:['suisse','schweiz','svizzera','swiss','helvetia']},
 792: {n:'Turkey',                k:'Ankara',          a:'TR', al:['turkiye','türkiye']},
 804: {n:'Ukraine',               k:'Kyiv',            a:'UA', al:['ukraina','kiev','kyjiv']},
 826: {n:'United Kingdom',        k:'London',          a:'GB', al:['uk','great britain','britain','england','gb']},
};

const EUI = new Set(Object.keys(CTR).map(Number));
const TOTAL = Object.keys(CTR).length;

// Country color palette (classic political map)
const PAL = ['#c5dba7','#f5d88a','#f5b09a','#9ac8e5','#c0a8d8','#a8d4c0','#f0c898','#d8c0a0','#e8d4a0','#b8dac8'];
const clr = id => PAL[id % PAL.length];

// Flag emoji from ISO alpha-2
const flag = a2 => a2 ? [...a2.toUpperCase()].map(c => String.fromCodePoint(c.charCodeAt(0)+127397)).join('') : '🌍';

/* ════════════════════════════════════════
   FUZZY MATCHING
════════════════════════════════════════ */
function normalize(s) {
  return s.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9 ]/g, '').replace(/ +/g, ' ').trim();
}

function levenshtein(a, b) {
  if (!a.length) return b.length;
  if (!b.length) return a.length;
  const m = a.length, n = b.length;
  const dp = Array.from({length: m+1}, (_, i) =>
    Array.from({length: n+1}, (_, j) => i === 0 ? j : j === 0 ? i : 0));
  for (let i = 1; i <= m; i++)
    for (let j = 1; j <= n; j++)
      dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] :
        1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
  return dp[m][n];
}

function isMatch(input, correct, aliases = []) {
  if (!input.trim()) return false;
  const ni = normalize(input), nc = normalize(correct);
  if (ni === nc) return true;
  for (const a of aliases) if (ni === normalize(a)) return true;
  const thr = nc.length <= 4 ? 1 : 2;
  if (levenshtein(ni, nc) <= thr) return true;
  for (const a of aliases) {
    const na = normalize(a);
    if (levenshtein(ni, na) <= (na.length <= 4 ? 1 : 2)) return true;
  }
  return false;
}

/* ════════════════════════════════════════
   GAME STATE
════════════════════════════════════════ */
const G = {
  score: 0, streak: 0, best: 0, perf: 0, part: 0,
  done: new Set(), cur: null,
  mode: "study", studied: new Set(), sidebarTimer: null
};

/* ════════════════════════════════════════
   MILESTONES
════════════════════════════════════════ */
// prompt = what to tell Claude so Zuzu says something milestone-appropriate
const MS = [
  {pts:0,   next:25,  idle:"Score 25 pts to wake Zuzu up! 🐾",
   prompt:null},
  {pts:25,  next:75,  idle:"75 pts for Zuzu's next take...",
   prompt:"You are Zuzu, a sassy TikTok chocolate Labradoodle. A 13-year-old just scored their first 25 points on a European geography quiz. You barely looked up from your nap. One sassy reaction sentence. Gen-Z dog energy. PG."},
  {pts:75,  next:175, idle:"175 pts for Zuzu's verdict...",
   prompt:"You are Zuzu, a sassy TikTok chocolate Labradoodle. A kid has 75 points on a European geography quiz. You're giving them a slow blink of mild interest. One sassy sentence. PG."},
  {pts:175, next:350, idle:"350 pts for Zuzu's shocked face!",
   prompt:"You are Zuzu, a sassy TikTok chocolate Labradoodle. A kid has 175 points! They actually know some Europe. You're reluctantly raising an eyebrow. One sassy impressed-ish sentence. PG."},
  {pts:350, next:500, idle:"500 pts for Zuzu's FINAL BOSS reaction!",
   prompt:"You are Zuzu, a sassy TikTok chocolate Labradoodle. 350 POINTS! A kid is genuinely crushing this European geography quiz. You are visibly shook. One short shocked and proud sentence. PG."},
  {pts:500, next:null, idle:"Zuzu has spoken. You're a legend. 🏆",
   prompt:"You are Zuzu, a sassy TikTok chocolate Labradoodle. A kid just dominated a European geography quiz with 500 points. You absolutely LOSE IT with excitement and disbelief. One hyped final sentence. PG."},
];
let prevMsI = 0;

function getProgressPct(sc) {
  for (let i = MS.length - 1; i >= 0; i--) {
    if (sc >= MS[i].pts) {
      if (i === MS.length - 1) return 100;
      return ((sc - MS[i].pts) / (MS[i+1].pts - MS[i].pts)) * 100;
    }
  }
  return 0;
}

function getMsIndex(sc) {
  for (let i = MS.length - 1; i >= 0; i--)
    if (sc >= MS[i].pts) return i;
  return 0;
}

/* ════════════════════════════════════════
   UI UPDATE
════════════════════════════════════════ */
function updateUI() {
  const sc = G.score;
  // Header
  (document.getElementById('hpts') || {}).textContent = sc;
  (document.getElementById('hdone') || {}).innerHTML = `${G.done.size}<span style="font-size:1rem;opacity:.55">/${TOTAL}</span>`;
  // Sidebar elements (removed — guard) 
  const setText = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
  const setHTML = (id, val) => { const el = document.getElementById(id); if (el) el.innerHTML = val; };
  setText('spts', sc);
  setHTML('sdone', `${G.done.size}<span style="font-size:.95rem;color:var(--grass2)">/${TOTAL}</span>`);
  setHTML('sstr', `${G.streak}<span style="font-size:.95rem">🔥</span>`);
  setText('std', G.done.size);
  setText('stpf', G.perf);
  setText('stpa', G.part);
  setText('stbs', G.best);
  const mi = getMsIndex(sc);
  const pct = getProgressPct(sc) + '%';
  const pf = document.getElementById('pfill'); if (pf) pf.style.width = pct;
  const cpf = document.getElementById('cpfill'); if (cpf) cpf.style.width = pct;
  (document.getElementById('mstone') || {}).textContent = MS[mi].idle || MS[mi].pts + ' pts reached!';
  const m = MS[mi];
  (document.getElementById('znxtlbl') || {}).textContent =
    m.next ? `${m.next - sc > 0 ? m.next - sc + ' pts' : '→'} for Zuzu's ${['first','next','next','shocked','FINAL'][mi] || 'next'} reaction!`
           : "Zuzu has spoken! You're a legend 🏆";

  // Check milestone crossing
  if (mi > prevMsI) { prevMsI = mi; triggerSidebarVideo(mi); }
}

function updateDoneList() {
  const tags = document.getElementById('dtags');
  if (!tags) return;
  const arr = [...G.done].map(id => CTR[id]).filter(Boolean)
    .sort((a, b) => a.n.localeCompare(b.n));
  if (!arr.length) {
    tags.innerHTML = '<span style="font-size:.62rem;color:var(--grass2);font-style:italic">Click a country on the map!</span>';
    return;
  }
  tags.innerHTML = arr.map(c => `<span class="dtag">${flag(c.a)} ${c.n}</span>`).join('');
}

/* ════════════════════════════════════════
   FLOATING POINTS ANIMATION
════════════════════════════════════════ */
function showFloatingPts(pts, x, y) {
  const d = document.createElement('div');
  d.className = 'fpt';
  d.textContent = `+${pts}`;
  d.style.left = x + 'px';
  d.style.top = y + 'px';
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 1800);
}

/* ════════════════════════════════════════
   MAP — pure SVG, no CDN dependency

const LONG_TEXTS = {"gb": "Waiting in line is a literal Olympic sport here. British people will form a perfect, single-file line for a bus that isn't even coming, just because it feels correct. Also, they call potato chips \"crisps\" and french fries \"chips\".", "fr": "They will go on strike because the weather is too nice, because the weather is too bad, or just because it's Tuesday. Also, you haven't truly known fear until you've been judged by a Parisian waiter who thinks your accent sounds like a dying lawnmower.", "it": "Hands are a mandatory part of the grammar system. If you tie an Italian's hands behind their back, they legally become mute. And don't you dare order a cappuccino after 11:00 AM unless you want to be judged by the entire country.", "de": "Fun is highly regulated and must be scheduled three weeks in advance. If you cross the street when the little pedestrian light is red \u2014 even if there hasn't been a car on that road since 1998 \u2014 you will get stared down like a federal fugitive.", "nl": "Everyone here is 8 feet tall and rides a bicycle like they're trying to win the Tour de France while balancing a week's worth of groceries. Plus, the country is so flat that a standard speed bump qualifies as a mountain.", "es": "Dinner starts at roughly midnight, and bedtime is just a suggestion. They take a daily nap (siesta) because staying awake for the absolute drama of their own history and reality TV is just too exhausting.", "ch": "Neutral about absolutely everything except cheese, chocolate, and hiding money. If an alien invasion happens, Switzerland will just sit in a mountain bunker polishing luxury watches, waiting for it to blow over.", "is": "The population is so small and interconnected that they literally have an app to check if the person they are flirting with at a party is actually their cousin.", "ie": "Ireland: They will apologize to a literal lampost if they bump into it, but will also call their best friend a \"total absolute gobshite\" as a term of high endearment. Also, their weather forecast is just rain.", "gr": "If you think your family is dramatic, try living in a place where every casual Sunday dinner sounds like a theatrical performance of a mythological war, complete with intense hand gestures and plates breaking.", "at": "They managed to convince the entire world that Beethoven was Austrian and Hitler was German, when it is actually the exact opposite. Absolute masterclass in public relations.", "be": "They invented french fries, let the French take all the credit for the name, and now they just make waffles and chocolate to cope with the existential regret.", "se": "The absolute kings of passive-aggression. They invented IKEA just so the rest of the world could experience the existential dread of missing a single wooden dowel. Also, remember the internet drama when we found out they don't feed their guests dinner? Unforgivable.", "no": "Flexing on the entire planet by being disgustingly rich from oil money, yet a single casual lunch there costs equivalent to a monthly car payment. Their main personality traits are cross-country skiing and aggressively gatekeeping the concept of \"cozy\" (koselig).", "dk": "A country so flat that a strong gust of wind could blow the entire population into Germany. They are responsible for LEGO, meaning they engineered the most painful household biohazard in human history.", "fi": "They are technically Nordic, but they deserve a shoutout for being the introverts of the world. Their idea of a wild Friday night is sitting in a 200\u00b0F wooden box (sauna), running outside to jump into a frozen lake, and not speaking a single word to another human being for four days.", "pl": "They have survived some of the wildest plot twists in European history on a diet of pure spite and pierogi. Also, their language is a chaotic riddle \u2014 why use vowels when you can just smash the letters z, c, s, and z together and call it a name?", "cz": "Beer is literally  vote, start a business, and probably marry a robot online here in five minutes. Despite having lightning-fast 5G, the stereotype among their neighbors is that Estonians talk and move in slow motion.", "lv": "Their national identity is split 50/50 between a deep, spiritual love for singing in the woods and an absolute, unhinged obsession with ice hockey. They also have an ongoing, bitter blood-feud with Estonia over who invented the decorated Christmas tree. It's the most wholesome beef in geopolitical history.", "lt": "They used to rule a massive empire that stretched all the way to the Black Sea, but now they are a small country whose entire emotional stability depends on an orange bouncy ball. If the national basketball team loses a game, the entire country goes into a state of mourning. Also, their favorite national dish is cepelinai, which are potato dumplings shaped like literal military zeppelins."};

// Zoom state
let zk=1, zx=0, zy=0;

function initMap() {
  const wrap = document.getElementById('mwrap');
  let W = wrap.clientWidth, H = wrap.clientHeight;
  if (W === 0 || H === 0) {
    requestAnimationFrame(() => setTimeout(initMap, 50));
    return;
  }

  const svgNS = 'http://www.w3.org/2000/svg';
  const msvg  = document.getElementById('msvg');
  msvg.innerHTML = '';
  msvg.setAttribute('width',  W);
  msvg.setAttribute('height', H);
  msvg.setAttribute('viewBox', `0 0 ${W} ${H}`);

  // Scale pre-computed paths to fit current container
  const sx = W / MAP_VW, sy = H / MAP_VH;
  const sc = Math.min(sx, sy);
  const tx = (W - MAP_VW * sc) / 2, ty = (H - MAP_VH * sc) / 2;
  const baseTransform = `translate(${tx},${ty}) scale(${sc})`;

  // Outer group — zoom/pan applied here
  const outer = document.createElementNS(svgNS,'g');
  outer.id = 'mapg';
  outer.setAttribute('transform', baseTransform);
  msvg.appendChild(outer);

  // Graticule
  const gpath = document.createElementNS(svgNS,'path');
  gpath.setAttribute('d', MAP_GRAT);
  gpath.setAttribute('fill','none');
  gpath.setAttribute('stroke','rgba(255,255,255,0.12)');
  gpath.setAttribute('stroke-width', 1/sc);
  outer.appendChild(gpath);

  // Shadow layer (offset copies)
  MAP_COUNTRIES.forEach(c => {
    const sh = document.createElementNS(svgNS,'path');
    sh.setAttribute('d', c.d);
    sh.setAttribute('fill','rgba(0,0,0,0.06)');
    sh.setAttribute('stroke','none');
    sh.setAttribute('transform','translate(1.5,1.5)');
    outer.appendChild(sh);
  });

  // Country fills
  MAP_COUNTRIES.forEach(c => {
    const p = document.createElementNS(svgNS,'path');
    p.setAttribute('d', c.d);
    p.setAttribute('fill', G.done.has(c.id) ? '#5aac5a' : mclr(c.id));
    p.setAttribute('stroke', 'rgba(255,255,255,0.55)');
    p.setAttribute('stroke-width', 0.8/sc);
    p.setAttribute('stroke-linejoin','round');
    p.id = 'c' + c.id;
    p.setAttribute('class', 'cp' + (G.done.has(c.id) ? ' done' : ''));
    p.style.cursor = 'pointer';
    p.addEventListener('click',  e => onCountryClick(e, c));
    p.addEventListener('mousemove', e => onMouseMove(e, c));
    p.addEventListener('mouseleave', onMouseLeave);
    outer.appendChild(p);
  });

  // Border mesh
  const mp = document.createElementNS(svgNS,'path');
  mp.setAttribute('d', MAP_MESH);
  mp.setAttribute('fill','none');
  mp.setAttribute('stroke','rgba(255,255,255,0.4)');
  mp.setAttribute('stroke-width', 0.7/sc);
  outer.appendChild(mp);

  // ── Zoom (wheel + buttons) ──────────────────────────────
  let curZ = 1, curTX = tx, curTY = ty;

  function applyZoom() {
    outer.setAttribute('transform', `translate(${curTX},${curTY}) scale(${sc * curZ})`);
    // Adjust stroke widths so borders stay thin when zoomed
    const sw = 0.8 / (sc * curZ);
    outer.querySelectorAll('.cp').forEach(el => el.setAttribute('stroke-width', sw));
    mp.setAttribute('stroke-width', 0.7 / (sc * curZ));
    gpath.setAttribute('stroke-width', 1 / (sc * curZ));
  }

  msvg.addEventListener('wheel', e => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.25 : 0.8;
    const newZ = Math.max(1, Math.min(10, curZ * factor));
    // Zoom toward cursor
    const rect = msvg.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    curTX = mx - (mx - curTX) * (newZ / curZ);
    curTY = my - (my - curTY) * (newZ / curZ);
    curZ = newZ;
    // Clamp pan so map doesn't go off-screen entirely
    const maxPan = W * curZ;
    curTX = Math.max(-maxPan, Math.min(maxPan, curTX));
    curTY = Math.max(-maxPan, Math.min(maxPan, curTY));
    applyZoom();
  }, {passive:false});

  function zoomBy(factor) {
    const rect = msvg.getBoundingClientRect();
    const cx = rect.width / 2, cy = rect.height / 2;
    const newZ = Math.max(1, Math.min(10, curZ * factor));
    if (newZ === curZ) return;
    curTX = cx - (cx - curTX) * (newZ / curZ);
    curTY = cy - (cy - curTY) * (newZ / curZ);
    curZ = newZ;
    applyZoom();
  }
  
  // ═══ TOUCH SUPPORT (mobile pan + pinch zoom) ═══
  let touchStartDist = 0, touchStartZoom = 1, touchStartTX = 0, touchStartTY = 0;
  let touchStartMidX = 0, touchStartMidY = 0;
  let lastTouchX = 0, lastTouchY = 0, isTouching = false;

  msvg.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      isTouching = true;
      lastTouchX = e.touches[0].clientX;
      lastTouchY = e.touches[0].clientY;
    } else if (e.touches.length === 2) {
      const t1 = e.touches[0], t2 = e.touches[1];
      touchStartDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
      touchStartZoom = curZ;
      touchStartTX = curTX;
      touchStartTY = curTY;
      const rect = msvg.getBoundingClientRect();
      touchStartMidX = (t1.clientX + t2.clientX) / 2 - rect.left;
      touchStartMidY = (t1.clientY + t2.clientY) / 2 - rect.top;
      isTouching = false;
    }
  }, { passive: true });

  msvg.addEventListener('touchmove', (e) => {
    if (e.touches.length === 1 && isTouching) {
      e.preventDefault();
      const dx = e.touches[0].clientX - lastTouchX;
      const dy = e.touches[0].clientY - lastTouchY;
      curTX += dx; curTY += dy;
      lastTouchX = e.touches[0].clientX;
      lastTouchY = e.touches[0].clientY;
      applyZoom();
    } else if (e.touches.length === 2 && touchStartDist > 0) {
      e.preventDefault();
      const t1 = e.touches[0], t2 = e.touches[1];
      const newDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
      const newZ = Math.max(1, Math.min(10, touchStartZoom * (newDist / touchStartDist)));
      // Anchor zoom at the midpoint of the two fingers
      const scale = newZ / touchStartZoom;
      curTX = touchStartMidX - (touchStartMidX - touchStartTX) * scale;
      curTY = touchStartMidY - (touchStartMidY - touchStartTY) * scale;
      curZ = newZ;
      applyZoom();
    }
  }, { passive: false });

  msvg.addEventListener('touchend', (e) => {
    if (e.touches.length === 0) {
      isTouching = false;
      touchStartDist = 0;
    } else if (e.touches.length === 1) {
      isTouching = true;
      lastTouchX = e.touches[0].clientX;
      lastTouchY = e.touches[0].clientY;
      touchStartDist = 0;
    }
  }, { passive: true });

    document.getElementById('zin').onclick  = () => zoomBy(1.5);
  document.getElementById('zout').onclick = () => zoomBy(1/1.5);
  document.getElementById('zrst').onclick = () => { curZ=1; curTX=tx; curTY=ty; applyZoom(); };

  // ── Pan (mouse drag) ────────────────────────────────────
  let dragging = false, dragX = 0, dragY = 0;
  msvg.addEventListener('mousedown', e => { if (e.button !== 0) return; dragging=true; dragX=e.clientX-curTX; dragY=e.clientY-curTY; msvg.style.cursor='grabbing'; });
  window.addEventListener('mouseup', () => { dragging=false; msvg.style.cursor=''; });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    curTX = e.clientX - dragX;
    curTY = e.clientY - dragY;
    applyZoom();
  });
}

/* ════════════════════════════════════════
   COUNTRY TEXT RENDERING + TTS KARAOKE
════════════════════════════════════════ */
function buildKaraokeHTML(text, name) {
  // Returns { html, speakText } — html has .kw spans + bold name
  const lowerText = text.toLowerCase();
  const lowerName = name.toLowerCase();
  let speakText, prefixText, bodyText;
  if (lowerText.startsWith(lowerName)) {
    prefixText = text.slice(0, name.length);
    bodyText   = text.slice(name.length);
    speakText  = text;
  } else {
    prefixText = name + '.';
    bodyText   = ' ' + text;
    speakText  = name + '. ' + text;
  }
  const escape = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const wrapWords = (str) => str.split(/(\s+)/).map(t =>
    /\S/.test(t) ? `<span class="kw">${escape(t)}</span>` : t
  ).join('');
  const html = `<strong>${wrapWords(prefixText)}</strong>${wrapWords(bodyText)}`;
  return { html, speakText };
}

let currentKaraokeTimer = null;
function stopKaraoke() {
  if (currentKaraokeTimer) { clearInterval(currentKaraokeTimer); currentKaraokeTimer = null; }
  if (window.speechSynthesis) speechSynthesis.cancel();
}

function narratorSpeak(speakText, container) {
  if (!window.speechSynthesis || !speakText) return;
  speechSynthesis.cancel();
  if (currentKaraokeTimer) { clearInterval(currentKaraokeTimer); currentKaraokeTimer = null; }

  const cleanText = speakText.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, '').trim();
  if (!cleanText) return;

  const doSpeak = () => {
    const utt = new SpeechSynthesisUtterance(cleanText);
    // Funny human voice: slightly faster + perky
    utt.rate = 1.08 + (Math.random() - 0.5) * 0.04;
    utt.pitch = 1.05 + (Math.random() - 0.5) * 0.08;
    utt.volume = 1.0;

    // Prefer expressive natural-sounding voices
    const voices = speechSynthesis.getVoices();
    const prefs = [
      /microsoft aria.*natural/i,
      /microsoft jenny.*natural/i,
      /microsoft ava.*natural/i,
      /microsoft emma.*natural/i,
      /google.+(uk|us).+(female|english)/i,
      /samantha/i,
      /karen|tessa|moira|fiona/i,
      /microsoft zira/i,
      /victoria/i,
    ];
    let pick = null;
    for (const re of prefs) {
      pick = voices.find(v => re.test(v.name) && v.lang.startsWith('en'));
      if (pick) break;
    }
    if (!pick) pick = voices.find(v => v.lang.startsWith('en') && !v.default);
    if (!pick) pick = voices.find(v => v.lang.startsWith('en'));
    if (pick) utt.voice = pick;

    // Karaoke sync
    if (container) {
      const words = container.querySelectorAll('.kw');
      if (words.length) {
        // Build char position → word index map
        const wordPositions = [];
        let charPos = 0;
        cleanText.split(/(\s+)/).forEach(tok => {
          if (/\S/.test(tok)) {
            wordPositions.push({ start: charPos, end: charPos + tok.length });
          }
          charPos += tok.length;
        });

        const light = (idx) => {
          for (let i = 0; i < words.length; i++) {
            words[i].classList.toggle('lit', i <= idx);
          }
        };

        let boundaryFired = false;
        utt.onboundary = (e) => {
          if (e.name !== 'word' && e.name !== '') return;
          boundaryFired = true;
          if (currentKaraokeTimer) { clearInterval(currentKaraokeTimer); currentKaraokeTimer = null; }
          const ci = e.charIndex;
          for (let i = 0; i < wordPositions.length; i++) {
            if (wordPositions[i].start <= ci && ci < wordPositions[i].end + 1) {
              light(i);
              return;
            }
          }
        };

        utt.onstart = () => {
          // Timer fallback in case boundary events don't fire
          const msPerWord = 1000 / (2.6 * (utt.rate || 1.0));
          let idx = 0;
          currentKaraokeTimer = setInterval(() => {
            if (boundaryFired) { clearInterval(currentKaraokeTimer); currentKaraokeTimer = null; return; }
            idx++;
            if (idx >= words.length) { clearInterval(currentKaraokeTimer); currentKaraokeTimer = null; light(words.length - 1); return; }
            light(idx);
          }, msPerWord);
        };

        utt.onend = () => {
          if (currentKaraokeTimer) { clearInterval(currentKaraokeTimer); currentKaraokeTimer = null; }
          light(words.length - 1);
        };
        utt.onerror = () => {
          if (currentKaraokeTimer) { clearInterval(currentKaraokeTimer); currentKaraokeTimer = null; }
        };
      }
    }

    speechSynthesis.speak(utt);
  };

  if (speechSynthesis.getVoices().length === 0) {
    speechSynthesis.onvoiceschanged = () => { doSpeak(); speechSynthesis.onvoiceschanged = null; };
    setTimeout(doSpeak, 150);
  } else {
    doSpeak();
  }
}

function openStudy(c, id) {
  stopKaraoke();
  const a2 = c.a.toLowerCase();
  const longText = LONG_TEXTS[a2];
  const shortJoke = SHORT_JOKES[a2];

  const displayName = (a2 === 'gb') ? 'Great Britain' : c.n;

  // Populate header
  document.getElementById('study-flag-pop').textContent = flag(c.a);
  document.getElementById('study-name-pop').textContent = displayName;
  document.getElementById('study-capital-pop').innerHTML = '🏛️ <span style="opacity:.75;font-size:.85em">Capital:</span> ' + c.k;

  // Reset
  const body = document.getElementById('study-body-pop');
  const wrap = document.getElementById('study-video-wrap-pop');
  const vid  = document.getElementById('study-video-pop');
  const textEl = document.getElementById('study-text-pop');
  body.classList.remove('no-video');
  wrap.style.display = 'none';
  textEl.style.display = 'none';
  textEl.classList.remove('joke-mode');
  textEl.innerHTML = '';

  // Pre-build karaoke HTML for whichever text we have
  const displayText = longText || shortJoke;
  const isJoke = !longText && !!shortJoke;
  let karaoke = null;
  if (displayText) {
    karaoke = buildKaraokeHTML(displayText, displayName);
    textEl.innerHTML = karaoke.html;
  }

  // Video reset
  vid.onloadeddata = null;
  vid.onerror = null;
  vid.ontimeupdate = null;
  try { vid.pause(); } catch(_) {}
  vid.removeAttribute('src');
  vid.load();

  vid.onloadeddata = () => {
    // Video loaded — show it, sync karaoke with video time
    wrap.style.display = 'flex';
    if (karaoke) {
      textEl.style.display = 'block';
      const words = textEl.querySelectorAll('.kw');
      vid.ontimeupdate = () => {
        if (!vid.duration) return;
        const progress = vid.currentTime / vid.duration;
        const upTo = Math.floor(progress * words.length);
        words.forEach((w, i) => w.classList.toggle('lit', i <= upTo));
      };
    }
    vid.play().catch(() => {});
  };

  vid.onerror = () => {
    // No video — center text, narrate with TTS karaoke
    wrap.style.display = 'none';
    body.classList.add('no-video');
    if (karaoke) {
      textEl.style.display = 'block';
      if (isJoke) textEl.classList.add('joke-mode');
      // Small delay so the popup is visible before speech starts
      setTimeout(() => narratorSpeak(karaoke.speakText, textEl), 350);
    }
  };

  vid.src = `media/countries/${a2}.mp4`;

  if (G.studied && !G.studied.has(id)) {
    G.studied.add(id);
    saveStudied();
  }

  document.getElementById('study-ov').classList.add('open');
}

function closeStudyPopup() {
  stopKaraoke();
  const vid = document.getElementById('study-video-pop');
  if (vid) {
    try { vid.pause(); } catch(_) {}
    vid.ontimeupdate = null;
    vid.removeAttribute('src');
    vid.load();
  }
  const textEl = document.getElementById('study-text-pop');
  if (textEl) textEl.querySelectorAll('.kw').forEach(w => w.classList.remove('lit'));
  document.getElementById('study-ov').classList.remove('open');
}

function setMode(mode) {
  G.mode = mode;
  document.getElementById('mode-study').classList.toggle('active', mode === 'study');
  document.getElementById('mode-quiz').classList.toggle('active', mode === 'quiz');
  // Show floating restart only in quiz mode
  const qrp = document.getElementById('quiz-restart-pill');
  if (qrp) qrp.classList.toggle('show', mode === 'quiz');
  // Close any open modal/video when switching
  closeModal();
  closeStudyPopup();
}

/* ════════════════════════════════════════
   QUIZ MODAL
════════════════════════════════════════ */
function openModal(c) {
  document.getElementById('mflag').textContent = flag(c.a);
  document.getElementById('mprompt').textContent = 'Identify this European country!';
  document.getElementById('ic').value = '';
  document.getElementById('ik').value = '';
  document.getElementById('ic').className = '';
  document.getElementById('ik').className = '';
  document.getElementById('rp').classList.remove('show');
  document.getElementById('sbtn').style.display = 'block';
  document.getElementById('sbtn').disabled = false;
  // Reset hints
  hintLoaded.c = false; hintLoaded.k = false;
  ['hcbtn','hkbtn'].forEach(id => { const el=document.getElementById(id); el.disabled=false; el.style.display=''; });
  ['hcbox','hkbox'].forEach(id => { const el=document.getElementById(id); el.classList.remove('show'); el.innerHTML=''; });
  // Reset idk button
  const idk = document.getElementById('idkbtn');
  idk.disabled = false; idk.textContent = "🤷 I don't know"; idk.style.display = '';
  // Reset pmsg class
  document.getElementById('pmsg').className = '';
  const zr = document.getElementById('zreact'); if (zr) zr.classList.remove('show');
  const zc = document.getElementById('zcap'); if (zc) zc.innerHTML = '';
  document.getElementById('ov').classList.add('open');
  setTimeout(() => document.getElementById('ic').focus(), 80);
}

function closeModal() {
  document.getElementById('ov').classList.remove('open');
  document.querySelectorAll('.cp').forEach(el => el.classList.remove('lit'));
  G.cur = null;
}

document.getElementById('ov').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
document.getElementById('cbtn').addEventListener('click', closeModal);
document.getElementById('sbtn').addEventListener('click', submitGuess);
document.addEventListener('keydown', e => {
  const ov = document.getElementById('ov');
  if (!ov.classList.contains('open')) return;
  if (e.key === 'Escape') { closeModal(); return; }
  if (e.key === 'Enter') {
    if (document.getElementById('rp').classList.contains('show')) closeModal();
    else submitGuess();
  }
});

/* ════════════════════════════════════════
   SUBMIT & SCORING
════════════════════════════════════════ */
function submitGuess() {
  const id = G.cur;
  if (!id) return;
  const c = CTR[id];

  const ci = document.getElementById('ic').value.trim();
  const ki = document.getElementById('ik').value.trim();

  if (!ci && !ki) {
    document.getElementById('ic').focus();
    return;
  }

  const cok = ci ? isMatch(ci, c.n, c.al) : false;
  const kok = ki ? isMatch(ki, c.k, c.al) : false;

  let pts = 0;
  if (cok && kok) { pts = 25; G.perf++; G.streak++; }
  else if (cok || kok) { pts = 10; G.part++; G.streak++; }
  else { G.streak = 0; }
  if (G.streak > G.best) G.best = G.streak;

  if (pts > 0) {
    G.score += pts;
    G.done.add(id);
    // Mark green on map
    const cdone = document.getElementById('c' + id);
    if (cdone) { cdone.classList.add('done'); cdone.classList.remove('lit'); cdone.setAttribute('fill','#5aac5a'); }
    // Float pts near modal
    const mr = document.getElementById('mdl').getBoundingClientRect();
    showFloatingPts(pts, mr.left + mr.width / 2 - 30, mr.top + 110);
    updateDoneList();
  }

  updateUI();

  // Colour inputs
  if (ci) document.getElementById('ic').className = cok ? 'ok' : 'no';
  if (ki) document.getElementById('ik').className = kok ? 'ok' : 'no';

  // Result rows
  const rcrow = document.getElementById('rcrow');
  const rkrow = document.getElementById('rkrow');
  if (ci) {
    rcrow.style.display = 'flex';
    document.getElementById('rci').textContent = cok ? '✅' : '❌';
    const rcl = document.getElementById('rcl');
    rcl.textContent = `Country: ${cok ? 'Correct!' : 'Wrong'}`;
    rcl.className = 'rrlb ' + (cok ? 'ok' : 'no');
    document.getElementById('rca').textContent = cok ? '' : `→ ${c.n}`;
  } else { rcrow.style.display = 'none'; }

  if (ki) {
    rkrow.style.display = 'flex';
    document.getElementById('rki').textContent = kok ? '✅' : '❌';
    const rkl = document.getElementById('rkl');
    rkl.textContent = `Capital: ${kok ? 'Correct!' : 'Wrong'}`;
    rkl.className = 'rrlb ' + (kok ? 'ok' : 'no');
    document.getElementById('rka').textContent = kok ? '' : `→ ${c.k}`;
  } else { rkrow.style.display = 'none'; }

  // Points display
  const pn = document.getElementById('pnum'), pm = document.getElementById('pmsg');
  if (pts === 25) {
    pn.textContent = '+25'; pn.style.color = '#d4a017';
    pm.textContent = '🌟 Perfect! Both correct!';
  } else if (pts === 10) {
    pn.textContent = '+10'; pn.style.color = '#d07020';
    pm.textContent = '👍 Partial credit!';
  } else {
    pn.textContent = '+0'; pn.style.color = '#e74c3c';
    pm.textContent = `😅 Answer: ${c.n} → ${c.k}`;
  }

  document.getElementById('rp').classList.add('show');
  document.getElementById('sbtn').style.display = 'none';
  document.getElementById('idkbtn').style.display = 'none';
  document.getElementById('hcbtn').style.display = 'none';
  document.getElementById('hkbtn').style.display = 'none';

  // Fire Zuzu reaction
  fireZuzuReaction(pts > 0 ? 'correct' : 'wrong', pts, c);

  // Win check
  if (G.done.size >= TOTAL) {
    setTimeout(() => {
      document.getElementById('winmsg').textContent =
        `Amazing! You scored ${G.score} points, got ${G.perf} perfect answers, and Zuzu cleared every obstacle! 🏆`;
      document.getElementById('winov').classList.add('open');
    }, 700);
  }
}

/* ════════════════════════════════════════
   HINTS  (Claude API — funny rhymes)
════════════════════════════════════════ */
const hintLoaded = { c: false, k: false };

function showHint(type) {
  const id = G.cur; if (!id) return;
  if (hintLoaded[type]) return;
  const btn = document.getElementById(type === 'c' ? 'hcbtn' : 'hkbtn');
  const box = document.getElementById(type === 'c' ? 'hcbox' : 'hkbox');
  const dict = type === 'c' ? HINT_C : HINT_K;
  const text = dict[id] || '(no hint available — give it your best guess!)';
  btn.disabled = true;
  box.innerHTML = '🎵 <em>' + text + '</em>';
  box.classList.add('show');
  hintLoaded[type] = true;
}

/* ════════════════════════════════════════
   I DON'T KNOW  (Claude API — funny reveal)
════════════════════════════════════════ */
function iDontKnow() {
  const id = G.cur; if (!id) return;
  const c = CTR[id];
  const reveals = [
    `😲 GASP! It was <strong>${c.n}</strong> ${flag(c.a)} all along — capital <strong>${c.k}</strong>! Even I was almost stumped!`,
    `🐕 Plot twist! The mystery country was <strong>${c.n}</strong> ${flag(c.a)} with its capital <strong>${c.k}</strong>. Better luck next time, human!`,
    `🎬 DUN-DUN-DUN! It's <strong>${c.n}</strong> ${flag(c.a)}, capital <strong>${c.k}</strong>! Now you know — go forth and conquer!`,
    `📍 Drumroll please... <strong>${c.n}</strong> ${flag(c.a)} with capital <strong>${c.k}</strong>! Keep learning, you got this!`,
    `🎉 The answer was <strong>${c.n}</strong> ${flag(c.a)} (capital: <strong>${c.k}</strong>)! No shame — geography is HARD!`,
  ];
  showIdkResult(pickRandom(reveals), c);
}

function showIdkResult(revealText, c) {
  // Colour both inputs red
  document.getElementById('ic').className = 'no';
  document.getElementById('ik').className = 'no';

  // Country row — show the answer
  document.getElementById('rcrow').style.display = 'flex';
  document.getElementById('rci').textContent = '📖';
  const rcl = document.getElementById('rcl');
  rcl.textContent = `Country: ${c.n} ${flag(c.a)}`;
  rcl.className = 'rrlb'; rcl.style.color = '#7a4e2a';
  document.getElementById('rca').textContent = '';

  // Capital row — show the answer
  document.getElementById('rkrow').style.display = 'flex';
  document.getElementById('rki').textContent = '📖';
  const rkl = document.getElementById('rkl');
  rkl.textContent = `Capital: ${c.k}`;
  rkl.className = 'rrlb'; rkl.style.color = '#7a4e2a';
  document.getElementById('rka').textContent = '';

  // Points display
  const pn = document.getElementById('pnum');
  const pm = document.getElementById('pmsg');
  pn.textContent = '+0'; pn.style.color = '#aaa';
  pm.innerHTML  = revealText;
  pm.className  = 'idk';

  document.getElementById('rp').classList.add('show');
  document.getElementById('sbtn').style.display = 'none';
  document.getElementById('idkbtn').style.display = 'none';
  document.getElementById('hcbtn').style.display = 'none';
  document.getElementById('hkbtn').style.display = 'none';

  // Fire Zuzu IDK reaction
  fireZuzuReaction('idk', 0, c);
}

function renderSidebarCaption(text, container) {
  container.innerHTML = '';
  const words = text.split(' ');
  words.forEach((word, i) => {
    const span = document.createElement('span');
    span.className = 'zcap-badge';
    span.textContent = word;
    span.style.animationDelay = (i * 0.11) + 's';
    container.appendChild(span);
    if (i < words.length - 1) container.appendChild(document.createTextNode(' '));
  });
}

function setZuzuMood(container, mood) {
  if (!container) return;
  container.className = 'zuzu-container ' + mood;
}
function ensureZuzuRendered(container) {
  if (container && !container.querySelector('svg')) {
    container.innerHTML = makeZuzuSVG();
  }
}
function startZuzuTalking(container) {
  if (!container) return;
  container.classList.add('talking');
}
function stopZuzuTalking(container) {
  if (!container) return;
  container.classList.remove('talking');
}

function zuzuSpeak(text, opts) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();

  // Strip emojis for cleaner speech
  const cleanText = text.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, '').trim();
  if (!cleanText) return;

  // Wait for voices to be loaded (chrome async loads)
  const speak = () => {
    const utt = new SpeechSynthesisUtterance(cleanText);
    const opt = opts || {};

    // Mood-based parameters — LOW pitch + SLOW rate = raspy dog growl voice
    const moodParams = {
      happy:  { rate: 0.95, pitch: 0.45 },
      shook:  { rate: 1.05, pitch: 0.55 },
      sass:   { rate: 0.82, pitch: 0.30 },
      angry:  { rate: 0.85, pitch: 0.15 },
      mid:    { rate: 0.88, pitch: 0.35 },
      idle:   { rate: 0.92, pitch: 0.40 },
    };
    const p = moodParams[opt.mood] || moodParams.idle;
    utt.rate = p.rate + (Math.random() - 0.5) * 0.05;
    utt.pitch = Math.max(0, p.pitch + (Math.random() - 0.5) * 0.08);
    utt.volume = 1.0;

    // Voice selection — prefer DEEP MALE voices for raspy dog growl
    const voices = window.speechSynthesis.getVoices();
    const preferredNames = [
      /microsoft guy.*natural/i,                // Edge neural — deep male
      /microsoft davis.*natural/i,              // Edge neural — deep male
      /microsoft brian.*natural/i,              // Edge neural — male
      /microsoft ryan.*natural/i,               // Edge neural — male UK
      /microsoft william.*natural/i,            // Edge neural — male AU
      /microsoft david/i,                       // Windows male
      /microsoft mark/i,                        // Windows male
      /microsoft george/i,                      // Windows male UK
      /microsoft james/i,                       // Windows male AU
      /google.+(uk|us).+english.+male/i,        // Chrome male
      /google uk english male/i,
      /google us english male/i,
      /alex/i,                                  // macOS premium male
      /daniel/i,                                // macOS male UK
      /fred|ralph|jorge|reed|rocko/i,           // macOS character voices (raspy/deep)
      /aaron/i,                                 // macOS male
    ];
    let pick = null;
    for (const re of preferredNames) {
      pick = voices.find(v => re.test(v.name) && v.lang.startsWith('en'));
      if (pick) break;
    }
    // Fallback: any male-sounding English voice
    if (!pick) pick = voices.find(v => v.lang.startsWith('en') && /male/i.test(v.name) && !/female/i.test(v.name));
    if (!pick) pick = voices.find(v => v.lang.startsWith('en') && !v.default);
    if (!pick) pick = voices.find(v => v.lang.startsWith('en'));
    if (pick) utt.voice = pick;

    // Talking-mouth animation hooks
    if (opt.container) {
      startZuzuTalking(opt.container);
      utt.onend = () => stopZuzuTalking(opt.container);
      utt.onerror = () => stopZuzuTalking(opt.container);
    }

    window.speechSynthesis.speak(utt);
  };

  // Voices may not be loaded yet
  if (window.speechSynthesis.getVoices().length === 0) {
    window.speechSynthesis.onvoiceschanged = () => { speak(); window.speechSynthesis.onvoiceschanged = null; };
    // Trigger load
    setTimeout(speak, 120);
  } else {
    speak();
  }
}

════════════════════════════════════════ */
window.addEventListener('DOMContentLoaded', () => {
  initMap();
  loadStudied();
  updateUI();
  initSidebarIdle();
  // Mode toggle
  document.getElementById('mode-study').addEventListener('click', () => setMode('study'));
  document.getElementById('mode-quiz').addEventListener('click', () => setMode('quiz'));
  // Study popup close handlers
  const closeBtn = document.getElementById('study-close');
  if (closeBtn) closeBtn.addEventListener('click', closeStudyPopup);
  const studyOv = document.getElementById('study-ov');
  if (studyOv) studyOv.addEventListener('click', (e) => {
    if (e.target.id === 'study-ov') closeStudyPopup();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && document.getElementById('study-ov').classList.contains('open')) {
      closeStudyPopup();
    }
  });
  // Floating quiz restart pill
  const qrp = document.getElementById('quiz-restart-pill');
  if (qrp) qrp.addEventListener('click', () => {
    if (confirm('Restart quiz? Your progress will be reset.')) location.reload();
  });
});

// Debounced resize handler
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(initMap, 260);
});
